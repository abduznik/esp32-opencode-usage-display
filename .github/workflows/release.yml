name: Build and Release Firmware

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [portrait, landscape]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware (${{ matrix.variant }})
        run: pio run -e esp32dev_${{ matrix.variant }}

      - name: Locate build artifacts
        run: |
          mkdir -p out
          SRC=.pio/build/esp32dev_${{ matrix.variant }}
          cp $SRC/firmware.bin out/firmware-${{ matrix.variant }}.bin
          cp $SRC/firmware.elf out/firmware-${{ matrix.variant }}.elf || true
          cp $SRC/bootloader.bin out/bootloader-${{ matrix.variant }}.bin || true
          cp $SRC/partitions.bin out/partitions-${{ matrix.variant }}.bin || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: out/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
